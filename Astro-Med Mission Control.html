<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Astro-Med Mission Control</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#060b1a;--cd:#0e1730;--bd:#1d2b52;--tx:#e6f0ff;--mu:#8ba0c8;--cy:#22d3ee;--pu:#8b5cf6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,rgba(10,18,48,.88),rgba(26,16,72,.88));border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0;flex:1;color:var(--cy);letter-spacing:.06em}h2{font-size:15px;margin:0 0 8px;color:var(--cy)}h3{font-size:13px;margin:10px 0 4px}
select,input,textarea,button{background:#0a1228;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
button{cursor:pointer}button:hover,button.on{border-color:var(--cy);color:var(--cy)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px}nav button{white-space:nowrap}
main{padding:8px 16px 40px;max-width:1200px;margin:auto}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:rgba(10,18,40,.78);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:16px;padding:14px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cv{position:relative;height:250px}.al{border-left:4px solid;margin:8px 0;padding:8px 10px;background:#0a1228;border-radius:8px}
.chat{height:340px;overflow-y:auto;white-space:pre-line}.m{margin:6px 0;padding:8px 10px;border-radius:12px;max-width:88%}.u{background:#1e3a8a;margin-left:auto}.b{background:#16224a}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
[data-p]{cursor:pointer}[data-p] *{fill:var(--c,#3b82f6);fill-opacity:.45;stroke:var(--c,#3b82f6);stroke-width:1.5}[data-p].sel *{stroke:#fff;stroke-width:3;fill-opacity:.8}
.sim{font-size:11px;color:#eab308}
@media print{#bgl{display:none}header,nav,.np{display:none}html,body{background:#fff;color:#000}.card{background:#fff;border:1px solid #999;color:#000}h2{color:#000}}

const $=s=>document.querySelector(s),M=a=>a.reduce((x,y)=>x+y,0)/a.length,SD=a=>{const m=M(a);return Math.sqrt(M(a.map(x=>(x-m)**2)))};

const L=[...Array(N)].map((_,i)=>new Date(new Date('2026-11-15')-(N-1-i)*864e5).toISOString().slice(5,10));
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
const AST=[{id:'AST-001',name:'Cdr. A. Rao',day:142,seed:11,dr:1,hx:'Mild tension headaches (2025)'},{id:'AST-002',name:'Dr. M. Okafor',day:98,seed:23,dr:0,hx:'None recorded'},{id:'AST-003',name:'Spc. L. Chen',day:61,seed:37,dr:.4,hx:'None recorded'}];
const E={rad:[],ct:[],co2:[],hum:[]};{const r=rng(5);for(let i=0;i<N;i++){E.rad.push(+(.55+r()*.15+(i>20?.1:0)).toFixed(2));E.ct.push(+(22.4+r()*.8).toFixed(1));E.co2.push(Math.round(3200+r()*400+i*28));E.hum.push(Math.round(40+r()*8))}}
AST.forEach(a=>{const r=rng(a.seed);a.d=[];for(let i=0;i<N;i++){const k=Math.max(0,i-14)/15*a.dr;a.d.push({rhr:Math.round(58+r()*4+k*9),spo2:+(97.6+r()*1.2-k*4.2).toFixed(1),sleep:+(7+r()*.8-k*2.2).toFixed(1),ex:Math.round(100+r()*30-k*40),fl:+(2.6+r()*.4-k*.9).toFixed(1),temp:+(36.6+r()*.3).toFixed(1),stress:Math.round(3+r()*1.5+k*3.5),fat:Math.round(3+r()*1.5+k*4)})}

let A=AST[0],role='Astronaut',tab='dash',R=14,selP='heart',cur=[];

const h=KB.find(x=>x[0].test(t)),r=reply_old(a,q);if(h){a.lastP=h[2];a.lastU=0}return r}

function assess(a){const ps=[...new Set(a.sym.map(s=>s.p))];if(!ps.length)return`No symptoms reported. Overall status from measurements: ${TXT[worst(a)]}.`;return ps.map(p=>{const u=a.sym.some(x=>x.p==p&&x.u&&!x.res);return`<b>${P[p][0]}</b> — ${TXT[stP(a,p)]}<br>`+detail(a,p,u).replace(/\n/g,'<br>')}).join('<hr>')}
function resolveSym(){A.sym.filter(x=>x.p==selP).forEach(x=>x.res=true);RMSG=`Marked as improved. ${P[selP][0]} status now follows your measurements: ${TXT[stP(A,selP)]}. The earlier reports stay in your history.`;go();speak(RMSG)}

function submitRep(){if(!RS){RMSG='Select a symptom first.';go();return}const u=RSV=='Severe'||/chest pain|shortness|palpitation/i.test(RS)?1:0;A.sym.push({d:N-1,n:RS.toLowerCase(),p:selP,u,sev:['Mild','Moderate','Severe'].indexOf(RSV)+1,dur:RD});A.last=RS.toLowerCase();A.lastP=selP;A.lastU=u;RMSG=`${u?'🚨 Escalated to the medical officer. ':''}Report logged: ${RS}, ${RSV.toLowerCase()}, ${RD.toLowerCase()}.\n\n`+detail(A,selP,u);RS='';go();speak(RMSG)}

function speak(x){if(!VOICE||!window.speechSynthesis)return;speechSynthesis.cancel();const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)&&/female|samantha|zira|google uk|natural/i.test(v.name))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));x.replace(/[🚨•]/g,'').replace(/SpO₂/g,'S P O 2').replace(/CO₂/g,'C O 2').replace(/\(not a diagnosis\)/g,', not a diagnosis').split(/\n+/).filter(s=>s.trim()).forEach(s=>{const u=new SpeechSynthesisUtterance(s);u.rate=.95;if(v)u.voice=v;speechSynthesis.speak(u)})}
function listen(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){alert('Voice input is not supported in this browser. Try Chrome or Edge.');return}const r=new S();r.lang='en-US';r.onresult=e=>{$('#ci').value=e.results[0][0].transcript;send()};r.onerror=()=>alert('Microphone is unavailable or blocked.');r.start()}
